[project]
name = "gateway-platform-plugin"
version = "0.1.7"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
